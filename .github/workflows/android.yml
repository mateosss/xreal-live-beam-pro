# Builds and tests every push and pull request. Pushing a version tag (v1.2.3, matching
# versionName in app/build.gradle.kts) also publishes a GitHub release with the signed APK;
# for tags pushed before this workflow existed, run it manually with the tag as input.
name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.3.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The tag being released, if any.
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ] && [ "$TAG" != "v$name" ]; then
            echo "::error::Tag $TAG does not match versionName $name"
            exit 1
          fi

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set: the APK is signed with a throwaway debug key and cannot update other installs"
          fi

      - name: Build, test and lint
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease testDebugUnitTest lintDebug

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/xreal-stereo-passthrough-v${{ steps.version.outputs.name }}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

      - name: Publish release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-from-tag --verify-tag
          fi
